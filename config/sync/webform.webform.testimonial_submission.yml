id: testimonial_submission
title: 'Share Your Story'
description: 'Testimonial and coalition signup form for OurKidsOurSchoolsVT.'
categories: {  }
elements: |
  name:
    '#type': textfield
    '#title': 'Your Name'
    '#required': true
    '#placeholder': 'Jane Smith'
    '#autocomplete': 'name'
  email:
    '#type': email
    '#title': 'Email Address'
    '#required': true
    '#placeholder': 'jane@example.com'
    '#autocomplete': 'email'
    '#description': 'We will never share your email address.'
  town:
    '#type': textfield
    '#title': 'Your Town'
    '#required': true
    '#placeholder': 'e.g. Burke, Waterford, Thetford…'
  role:
    '#type': select
    '#title': 'Your Connection'
    '#required': true
    '#empty_option': 'Select one…'
    '#options':
      parent: 'Parent of a tuitioning student'
      student: 'Student'
      alumni: 'Alumni of an independent school'
      teacher: 'Teacher / School staff'
      employer: 'Local employer / Business owner'
      community: 'Community member / Neighbor'
      other: 'Other'
  school_connection:
    '#type': textfield
    '#title': 'School Connection'
    '#placeholder': 'e.g. St. Johnsbury Academy, Lyndon Institute…'
    '#description': 'Which school are you connected to?'
  testimonial:
    '#type': textarea
    '#title': 'Your Story'
    '#required': true
    '#rows': 6
    '#placeholder': 'Tell us what independent schools mean to your family and community, and what losing access would mean for you.'
    '#description': 'Please share as much or as little as you are comfortable with.'
  permission_to_publish:
    '#type': checkbox
    '#title': 'I give OurKidsOurSchoolsVT permission to publish my story (with my name and town) on this website and in campaign materials.'
    '#required': false
  opt_in:
    '#type': checkbox
    '#title': 'Keep me informed about OurKidsOurSchoolsVT updates and actions.'
    '#required': false
