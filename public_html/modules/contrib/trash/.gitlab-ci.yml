include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_PREVIOUS_MAJOR: 1
  # The previous major jobs are the oldest-core baseline, so run them
  # automatically instead of manually.
  _AUTORUN_PREVIOUS_MAJOR: 'all'
  _CSPELL_WORDS: 'Csvg, Cpath, Unrestorable, trashable'

# Test against the oldest core release the module supports, so the pipeline
# catches anything that only works on a newer minor. The default and 'next
# minor' jobs cover the other end of the range.
composer (previous major):
  variables:
    DRUPAL_CORE: '10.3.0'

composer-lint:
  allow_failure: false

eslint:
  allow_failure: false

cspell:
  allow_failure: false

phpcs:
  allow_failure: false

phpstan:
  allow_failure: false

phpstan (next minor):
  allow_failure: false

phpstan (previous major):
  allow_failure: true

phpunit (next minor):
  allow_failure: false

phpunit (previous major):
  allow_failure: false

phpunit:
  allow_failure: false
  parallel:
    matrix:
      - _TARGET_DB_TYPE: 'mysql'
        _TARGET_DB_VERSION: '8'
      - _TARGET_DB_TYPE: 'pgsql'
        _TARGET_DB_VERSION: '16'
      - _TARGET_DB_TYPE: 'sqlite'
        _TARGET_DB_VERSION: '3'
