lead:      "Act 73's push for equal educational opportunities could leave rural students with fewer choices, longer commutes and the loss of long-standing local school partnerships."
body: >
  <p>
      Vermont has a public education system unlike any other state in the country. In roughly 90 towns, there is no public school for some or all grade levels. Instead, the town pays tuition on behalf of each student to attend an approved school elsewhere. The family chooses the school. The town pays the bill. This is called town tuitioning, and it has existed in Vermont for over 150 years.
  </p>
  <p>
      If you are new to the concept, or new to Vermont, the system can sound unusual. It is not a voucher program. It is not a loophole. It is the way Vermont has delivered public high school education in rural areas since before the Civil War. This page explains how it actually works, why it exists, and why recent legislation is changing it.
  </p>
  <h2>
      The Basic Structure
  </h2>
  <p>
      Vermont has 119 school districts. Some of them operate their own schools for every grade level, pre-kindergarten through twelfth. These are called operating districts. Others operate schools for some grades but not others. A town might run an elementary school but not a high school, for example. And some towns do not operate schools at all.
  </p>
  <p>
      Towns that do not operate a school for a particular grade level are called non-operating towns. For those grade levels, the town pays tuition to send its students to an approved school somewhere else. The family selects the school from the list of approved options. The sending town pays the receiving school directly. The student attends.
  </p>
  <p>
      This is codified in Vermont statute, specifically 16 V.S.A. Chapter 21. The legal structure dates back to 1869, when Vermont first authorized towns to send students to approved private academies when no public option was available nearby. Some of those academies, including St. Johnsbury Academy, Lyndon Institute, Thetford Academy, and Burr and Burton Academy, have operated continuously since the 1800s and are still the receiving schools for their regional tuitioning towns today.
  </p>
  <h2>
      Why Vermont Uses This System
  </h2>
  <p>
      Vermont is geographically a challenging state in which to build a comprehensive public school system. It is predominantly rural, mountainous, and sparsely populated. In the Northeast Kingdom, Orange County, the Islands, and other rural regions, many towns do not have enough students to sustain a K-12 school on their own. Consolidating every rural town into a single regional public high school would mean bus rides of 45 minutes to an hour each way for many students.
  </p>
  <p>
      Tuitioning solves this problem by allowing multiple small towns to share access to a larger regional school. The school achieves scale. The towns keep their identity. Students get a quality high school education without a two-hour daily commute.
  </p>
  <blockquote>
      <p>
          Tuitioning is not a private school voucher system. It is public education delivered through a regional model that Vermont has refined over 150 years. The families who depend on it live in towns that have never operated their own high schools.
      </p>
  </blockquote>
  <p>
      Four of Vermont's oldest independent schools, known as traditional academies, emerged specifically to serve this regional model. St. Johnsbury Academy, founded in 1842, serves students from St. Johnsbury and more than 25 surrounding towns. Lyndon Institute, Thetford Academy, and Burr and Burton Academy serve similar regional functions in their respective areas. These schools exist because tuitioning exists. They were built by the communities around them and have operated as regional anchors for generations.
  </p>
  <h2>
      How the Money Works
  </h2>
  <p>
      The Vermont Agency of Education calculates an allowable tuition rate each year for public schools, based on actual allowable expenditures divided by enrolled students. For tuitioning purposes, the law caps the amount a non-operating town must pay at the average announced tuition of Vermont's union high schools. In 2025 to 2026, this figure is approximately $19,000 per student per year, though it varies.
  </p>
  <p>
      A sending town pays the allowable tuition amount to the receiving school. The receiving school educates the student. That is the basic transaction.
  </p>
  <p>
      In practice, the economics are slightly more complex. Traditional academies like SJA and Lyndon Institute offer programming that costs more to operate than the allowable tuition covers. They have made up the difference historically through three sources: endowment income built over more than a century of existence, private fundraising, and modest family contributions above the public tuition amount. At SJA the family top-up has been a few thousand dollars per year. At schools like Riverside School in Lyndonville, where the public cap does not cover even basic operations, families pay significantly more out of pocket.
  </p>
  <h2>
      Oversight and Accountability
  </h2>
  <p>
      A common misconception is that independent schools receiving public tuition dollars operate without oversight. They do not.
  </p>
  <p>
      All tuitioning-eligible schools must be approved by the Vermont Agency of Education and are governed by Rule Series 2200, a standard nearly twice the length of the requirements for public schools. They must be formally re-approved every five years. They are subject to the same background checks, mandated reporter laws, and statewide assessment requirements as public schools.
  </p>
  <p>
      Under Act 173, passed in 2018, independent schools receiving public tuition dollars are required to accommodate students with special education needs. They must comply with state and federal anti-discrimination laws. They must meet education quality standards.
  </p>
  <p>
      By any reasonable measure, the accountability framework is robust. Independent schools receiving public tuition are among the most heavily regulated institutions in Vermont.
  </p>
  <h2>
      What the Data Shows
  </h2>
  <p>
      Students attending independent schools on public tuition represent approximately 4 percent of Vermont's total student population and account for roughly 3 percent of Education Fund spending. On a per-pupil basis, districts with tuitioning spend about $184 less than the state average ($13,763 versus $13,947). Independent schools receive no state construction aid, while public schools statewide carry over $6 billion in deferred maintenance.
  </p>
  <p>
      In other words, the population of students served by tuitioning is small, the cost is proportionally low, and the model is cost-effective relative to the public school average.
  </p>
  <h2>
      The Recent Changes
  </h2>
  <p>
      Act 73, signed into law in 2025, substantially restricted the tuitioning system. Before Act 73, 46 independent schools were eligible to receive public tuition. Act 73 reduced that number to 18. The law requires eligible schools to be located in supervisory unions without a public school for some grades and to have had at least 25 percent of their 2023 to 2024 enrollment funded by Vermont public school districts.
  </p>
  <p>
      Two lawsuits are currently challenging Act 73's restrictions. One was filed by two parents from Georgia, Vermont whose younger children will be shut out of Rice Memorial High School because the school no longer meets Act 73's eligibility threshold. The other was filed by Mid Vermont Christian School on religious discrimination grounds.
  </p>
  <p>
      H.955, the current education transformation bill, would add additional restrictions. Section 24 of H.955 would prohibit tuitioning schools from charging families any amount above the allowable tuition paid by their town. If enacted, this would effectively end the financial model that has sustained traditional academies for over a century.
  </p>
  <h2>
      What Is At Stake
  </h2>
  <p>
      Tuitioning is not a private school voucher system. It is public education delivered through a regional model that Vermont has refined over 150 years. The families who depend on it live in towns that have never operated their own high schools, not because of any ideological preference, but because the math of rural population density makes it impractical.
  </p>
  <p>
      Ending or crippling the tuitioning system would not restore a public school system that never existed in these towns. It would force rural students onto hour-long bus rides to schools their families never chose, disrupt regional academies that serve as economic anchors for their communities, and accelerate the departure of the working families rural Vermont most needs to retain.
  </p>
