bio: >
  <p>Sean Montague lives in Burke Hollow, Vermont with his family. He has been a resident of the Northeast Kingdom for over twelve years, drawn here in part by the quality of education available to his children through Vermont's tuitioning system.</p>
  <p>His children attend St. Johnsbury Academy and Riverside School. He volunteers as a web developer for OurKidsOurSchoolsVT, building the technical infrastructure the coalition uses to reach families across Vermont and connect them with their legislators.</p>
  <p>Sean works remotely as a federal employee with the Smithsonian's National Museum of Natural History. He has written about the economic and educational stakes of Vermont's school choice debate for VTDigger.</p>
